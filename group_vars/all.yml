---
# Red Hat Satellite 6.17 Installation Variables
# Variables injected by AAP are marked with "From AAP credential"

# Satellite Server Configuration 
sat_version: "6.17"
satellite_fqdn: "satellitetestserver.com"
satellite_shortname: "satellite-test"
satellite_server_url: "https://{{ satellite_fqdn }}"  # Used in module_defaults
satellite_loadbalanced: false  # Set to true if behind a load balancer
satellite_loadbalancer_fqdn: ""  # Load balancer FQDN if applicable
satellite_setup_username: "admin"  # Default admin user
satellite_initial_admin_password: "vault"
server_proxy_hostname: proxy-zsgov.external.lmco.com
uuid: "e4b7f5a0-8c3d-11e9-bc42-526af7764f64"  # EO_ITRA UUID from the portal

# Hosts that are Capsules (exact FQDNs).
capsule_fqdns:
  - capsule1.example.com
  - capsule2.example.com

# API Credentials - Injected from AAP
satellite_api_username: "{{ server_specific_username }}"  # This will have to be setup AFTER the install of Satellite(user) and will be a credential in AAP
satellite_api_password: "{{ Satellite_API_token_us }}"  # From AAP credential setup AFTER the install of Satellite(token)

# Organization and Location
satellite_org: "EO_ITRA"  # Organization name for installation
satellite_location: "default_location"  # Location for installation

# Installation Configuration
satellite_installer_scenario: "satellite"  # Installer scenario
satellite_custom_cert_path: "/root/sat_cert/{{ satellite_shortname }}"  # Path for custom certificates

# DNS Configuration
validate_dns: true  # Perform DNS validation before installation
dns_timeout: 5  # DNS lookup timeout in seconds

# Optimized for production with 8-11TB content stores

# SATELLITE STORAGE CONFIGURATION
# Total: ~9.7TB across 14 logical volumes
# Optimized for main Satellite server with full content management
satellite_storage_config:
  vg_name: "vgsat"
  # PE size optimization for large volumes (set at pool level in task)
  # data_disk is auto-detected and added dynamically
  volumes:
    # Critical system maintenance volume
    - name: "lvlibfmaintain"
      size: "16g"
      mount_point: "/var/lib/foreman-maintain"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Squid proxy cache for content delivery
    - name: "lvsquid"
      size: "14g"
      mount_point: "/var/spool/squid"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Maintenance logs - high write volume
    - name: "lvlogfmaintain"
      size: "24g"
      mount_point: "/var/log/foreman-maintain"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Pulp cache - temporary content storage
    - name: "lvcpulp"
      size: "27g"
      mount_point: "/var/cache/pulp"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Backup storage - critical for disaster recovery
    - name: "lvbackup"
      size: "512g"
      mount_point: "/backup"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime,nobarrier"  # nobarrier for backup performance
      state: present
    
    # PRIMARY CONTENT STORE - All RPMs, ISOs, and synced content
    # This is where the bulk of your Satellite content lives
    - name: "lvlpulp"
      size: "8192g"  # 8TB for production content
      mount_point: "/var/lib/pulp"
      fs_type: "xfs"
      fs_resize: true
      # Optimized mount options for large file operations
      mount_options: "defaults,noatime,nodiratime,nobarrier,largeio,inode64,allocsize=128m"
      state: present
    
    # Message queue persistence
    - name: "lvqpidd"
      size: "7g"
      mount_point: "/var/lib/qpidd"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # PostgreSQL database - critical for performance
    - name: "lvpgsql"
      size: "200g"
      mount_point: "/var/lib/pgsql"
      fs_type: "xfs"
      fs_resize: true
      # Database optimized options
      mount_options: "defaults,noatime,nodiratime,nobarrier"
      state: present
    
    # Foreman task backups
    - name: "lvlibftasks"
      size: "14g"
      mount_point: "/var/lib/foreman/tasks-backup"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Apache/httpd logs - high write volume
    - name: "lvhttpdLog"
      size: "14g"
      mount_point: "/var/log/httpd"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Pulp content exports for disconnected environments
    - name: "lvpulpexports"
      size: "500g"
      mount_point: "/var/lib/pulp/exports"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime,nobarrier"
      state: present
    
    # Candlepin service logs
    - name: "lvcandlepinLog"
      size: "7g"
      mount_point: "/var/log/candlepin"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Foreman application logs
    - name: "lvforemanLog"
      size: "7g"
      mount_point: "/var/log/foreman"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present

# CAPSULE STORAGE CONFIGURATION
# Similar to Satellite but without some components
# Capsules don't need Candlepin or Foreman logs (proxy only)
capsule_storage_config:
  vg_name: "vgsat"  # Same VG name for consistency
  # PE size optimization for large volumes (set at pool level in task)
  # data_disk is auto-detected and added dynamically
  volumes:
    # Critical system maintenance volume
    - name: "lvlibfmaintain"
      size: "16g"
      mount_point: "/var/lib/foreman-maintain"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Squid proxy cache for local content delivery
    - name: "lvsquid"
      size: "14g"
      mount_point: "/var/spool/squid"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Maintenance logs
    - name: "lvlogfmaintain"
      size: "24g"
      mount_point: "/var/log/foreman-maintain"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Pulp cache - temporary content storage
    - name: "lvcpulp"
      size: "27g"
      mount_point: "/var/cache/pulp"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Backup storage for Capsule-specific data
    - name: "lvbackup"
      size: "512g"
      mount_point: "/backup"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime,nobarrier"
      state: present
    
    # PRIMARY CONTENT STORE - Synced from main Satellite
    # Capsules typically need same size as Satellite for full mirror
    - name: "lvlpulp"
      size: "8192g"  # 8TB to mirror Satellite content
      mount_point: "/var/lib/pulp"
      fs_type: "xfs"
      fs_resize: true
      # Optimized for large file operations and content sync
      mount_options: "defaults,noatime,nodiratime,nobarrier,largeio,inode64,allocsize=128m"
      state: present
    
    # Message queue persistence (smaller for Capsule)
    - name: "lvqpidd"
      size: "7g"
      mount_point: "/var/lib/qpidd"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # PostgreSQL database (Capsule uses less DB)
    - name: "lvpgsql"
      size: "200g"
      mount_point: "/var/lib/pgsql"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime,nobarrier"
      state: present
    
    # Apache/httpd logs for content serving
    - name: "lvhttpdLog"
      size: "14g"
      mount_point: "/var/log/httpd"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Candlepin proxy logs (Capsule still has some Candlepin components)
    - name: "lvcandlepinLog"
      size: "7g"
      mount_point: "/var/log/candlepin"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present
    
    # Foreman proxy logs
    - name: "lvforemanLog"
      size: "7g"
      mount_point: "/var/log/foreman"
      fs_type: "xfs"
      fs_resize: true
      mount_options: "defaults,noatime,nodiratime"
      state: present

# Package Requirements
satellite_required_packages:
  - ansible-core
  - chrony
  - sos
  - tmux
  - bash-completion
  - tree
  - yum-utils
  - dnf-utils
  - git
  - lvm2

# Repository Configuration for CDN
satellite_repos_to_enable:
  - "rhel-{{ rhel_major_version }}-for-x86_64-baseos-rpms"
  - "rhel-{{ rhel_major_version }}-for-x86_64-appstream-rpms"
  - "satellite-{{ sat_version }}-for-rhel-{{ rhel_major_version }}-x86_64-rpms"
  - "satellite-maintenance-{{ sat_version }}-for-rhel-{{ rhel_major_version }}-x86_64-rpms"

# System Configuration
selinux_mode: "permissive"  # SELinux mode during installation
firewall_enabled: false  # Disable firewall for simplicity

# Reboot Configuration
check_reboot_required: true  # Check if reboot is needed after updates
auto_reboot: false  # Automatically reboot if required
reboot_timeout: 600  # Reboot timeout in seconds

# Mount Options Explained:
# - defaults: Standard Linux mount options (rw, suid, dev, exec, auto, nouser, async)
# - noatime: Don't update access time on file access (significant performance boost)
# - nodiratime: Don't update directory access times (additional performance boost)
# - nobarrier: Disable write barriers (faster writes, use only with battery-backed storage)
# - largeio: Optimize for large I/O operations (perfect for ISOs and large RPMs)
# - inode64: Allow inodes anywhere on large filesystems (required for 8TB+ volumes)
# - allocsize=128m: Pre-allocate space in 128MB chunks (reduces fragmentation for large files)

# Why these optimizations matter:
# 1. PE size 128 MiB (set in task): Reduces LVM metadata by 97% for 8TB volumes
# 2. fs_resize: true: Allows online filesystem growth without downtime
# 3. noatime/nodiratime: Can reduce I/O by 10-30% on busy systems
# 4. XFS with optimizations: Best filesystem for large files and parallel operations
# 5. allocsize=128m: Perfect for Satellite's large RPM and ISO files

