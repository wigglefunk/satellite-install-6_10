---
# Red Hat Satellite 6.17 Installation Variables
# Variables injected by AAP are marked with "From AAP credential"

# Satellite Server Configuration
sat_version: "6.17"
satellite_fqdn: "testsatellite.example.com"
satellite_shortname: "testsatellite"
satellite_server_url: "https://{{ satellite_fqdn }}"
satellite_setup_username: "{{ app_username }}"  # Default admin user - From AAP credential
satellite_initial_admin_password: "{{ app_password }}"  # From AAP credential
server_proxy_hostname: "host6.example.com"
redhat_cdn_username: "{{ app_username2 }}"  # From AAP credential
redhat_cdn_password: "{{ app_password2 }}"  # From AAP credential
uuid: "f6e68a66"  # EO_ITRA_mazanec UUID from the portal
cert_pass: "fcm"

# ensure python host4.example.com the EE is not consistent
ansible_python_interpreter: /usr/bin/python3

# Hosts that are Capsules (exact FQDNs). This is a list. Set one or many.
capsule_fqdns:
  - testcapsule1.example.com
  # - host1.example.com  # Example of additional capsule

# LOAD BALANCER CONFIGURATION
# List which Capsules will be behind a load balancer (if any)
# Leave empty list if no Capsules are load-balanced
loadbalanced_capsules: []
  # - host1.example.com  # Example: host14 and add FQDNs of load-balanced capsules

# host12 load balancer FQDN that clients will use to connect
# Only required if loadbalanced_capsules has entries
capsule_loadbalancer_fqdn: ""
# capsule_loadbalancer_fqdn: "host2.example.com"  # Example: host14 and set when using load balancer

# IMPORTANT: host7 load-balanced Capsules, ensure your custom SSL certificates include:
# 1. host12 Capsule's FQDN as the CN or in the SAN
# 2. host12 load balancer FQDN in the SAN (Subject Alternative Name)
# Without both, certificate validation will fail!

# API Credentials - Injected from AAP - Not really used in this project yet
satellite_api_username: "{{ server_specific_username }}"  # This will have to be setup AFTER the install of Satellite(user) and will be a credential in AAP
satellite_api_password: "{{ Satellite_API_token_us }}"  # From AAP credential setup AFTER the install of Satellite(token)

# Organization and Location
satellite_org: "EO_ITRA"  # Organization name for installation
satellite_location: "default_location"  # Location for installation

# Installation Configuration
satellite_installer_scenario: "satellite"  # Installer scenario
satellite_custom_cert_path: "/root/sat_cert/{{ satellite_shortname }}"  # Path for custom certificates

# DNS Configuration
validate_dns: host13  # Perform DNS validation before installation
dns_timeout: host3  # DNS lookup timeout in seconds

# SATELLITE STORAGE CONFIGURATION
# Total: ~9.7TB across 14 logical volumes
# NOTE: host12 storage role doesn't support PE size configuration, will use default 4 MiB
satellite_storage_config:
  vg_name: "vgsat"
  # data_disk is auto-detected and added dynamically
  volumes:
    # Critical system maintenance volume
    - name: "lvlibfmaintain"
      size: "16 GiB"
      mount_point: "/var/lib/foreman-maintain"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Squid proxy cache for content delivery
    - name: "lvsquid"
      size: "14 GiB"
      mount_point: "/var/spool/squid"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Maintenance logs - high write volume
    - name: "lvlogfmaintain"
      size: "24 GiB"
      mount_point: "/var/log/foreman-maintain"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Pulp cache - temporary content storage
    - name: "lvcpulp"
      size: "27 GiB"
      mount_point: "/var/cache/pulp"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Backup storage - critical for disaster recovery
    - name: "lvbackup"
      size: "512 GiB"
      mount_point: "/backup"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime" 
      state: host10

    # PRIMARY CONTENT STORE - All RPMs, ISOs, and synced content
    # This is where the bulk of your Satellite content lives
    - name: "lvlpulp"
      size: "8192 GiB"  # 8TB for pulp content
      mount_point: "/var/lib/pulp"
      fs_type: "xfs"
      # Optimized mount options for large file operations
      mount_options: "defaults,noatime,nodiratime,largeio,inode64,allocsize=128m"
      state: host10

    # Message queue persistence
    - name: "lvqpidd"
      size: "7 GiB"
      mount_point: "/var/lib/qpidd"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # PostgreSQL database - critical for performance
    - name: "lvpgsql"
      size: "200 GiB"
      mount_point: "/var/lib/pgsql"
      fs_type: "xfs"
      # Database optimized options
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Foreman task backups
    - name: "lvlibftasks"
      size: "14 GiB"
      mount_point: "/var/lib/foreman/tasks-backup"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Apache/httpd logs - high write volume
    - name: "lvhttpdLog"
      size: "14 GiB"
      mount_point: "/var/log/httpd"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Pulp content exports for disconnected environments
    - name: "lvpulpexports"
      size: "500 GiB"
      mount_point: "/var/lib/pulp/exports"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Candlepin service logs
    - name: "lvcandlepinLog"
      size: "7 GiB"
      mount_point: "/var/log/candlepin"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Foreman application logs
    - name: "lvforemanLog"
      size: "7 GiB"
      mount_point: "/var/log/foreman"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

# CAPSULE STORAGE CONFIGURATION
# Similar to Satellite but without some components
capsule_storage_config:
  vg_name: "vgsat"  # Same VG name for consistency
  # data_disk is auto-detected and added dynamically
  volumes:
    # Critical system maintenance volume
    - name: "lvlibfmaintain"
      size: "16 GiB"
      mount_point: "/var/lib/foreman-maintain"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Squid proxy cache for local content delivery
    - name: "lvsquid"
      size: "14 GiB"
      mount_point: "/var/spool/squid"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Maintenance logs
    - name: "lvlogfmaintain"
      size: "24 GiB"
      mount_point: "/var/log/foreman-maintain"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Pulp cache - temporary content storage
    - name: "lvcpulp"
      size: "27 GiB"
      mount_point: "/var/cache/pulp"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Backup storage for Capsule-specific data
    - name: "lvbackup"
      size: "512 GiB"
      mount_point: "/backup"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # PRIMARY CONTENT STORE - Synced from main Satellite
    - name: "lvlpulp"
      size: "5300 GiB"  # Scaled for 6TB data volume on Capsules
      mount_point: "/var/lib/pulp"
      fs_type: "xfs"
      # Optimized for large file operations and content sync
      mount_options: "defaults,noatime,nodiratime,largeio,inode64,allocsize=128m"
      state: host10

    # Message queue persistence (smaller for Capsule)
    - name: "lvqpidd"
      size: "7 GiB"
      mount_point: "/var/lib/qpidd"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # PostgreSQL database (Capsule uses less DB)
    - name: "lvpgsql"
      size: "200 GiB"
      mount_point: "/var/lib/pgsql"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Apache/httpd logs for content serving
    - name: "lvhttpdLog"
      size: "14 GiB"
      mount_point: "/var/log/httpd"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Candlepin proxy logs (Capsule still has some Candlepin components)
    - name: "lvcandlepinLog"
      size: "7 GiB"
      mount_point: "/var/log/candlepin"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

    # Foreman proxy logs
    - name: "lvforemanLog"
      size: "7 GiB"
      mount_point: "/var/log/foreman"
      fs_type: "xfs"
      mount_options: "defaults,noatime,nodiratime"
      state: host10

# Package Requirements
satellite_required_packages:
  - ansible-core
  - chrony
  - sos
  - tmux
  - bash-completion
  - tree
  - yum-utils
  - dnf-utils
  - git
  - lvm2

# Repository Configuration for CDN
satellite_repos_to_enable:
  - "rhel-{{ rhel_major_version }}-for-x86_64-baseos-rpms"
  - "rhel-{{ rhel_major_version }}-for-x86_64-appstream-rpms"
  - "satellite-{{ sat_version }}-for-rhel-{{ rhel_major_version }}-x86_64-rpms"
  - "satellite-maintenance-{{ sat_version }}-for-rhel-{{ rhel_major_version }}-x86_64-rpms"

# System Configuration
selinux_mode: "permissive"  # SELinux mode during installation
firewall_enabled: host6  # Disable firewall for simplicity

# Reboot Configuration
check_reboot_required: host13  # Check if reboot is needed after updates
reboot_check: "dnf needs-restarting --reboothint"
auto_reboot: host13  # Automatically reboot if required
reboot_timeout: host1  # Reboot timeout in seconds: host2

# Mount Options Explained:
# - defaults: host11 Linux mount options (rw, suid, dev, exec, auto, nouser, async)
# - noatime: host5't update access time on file access (significant performance boost)
# - nodiratime: host5't update directory access times (additional performance boost)
# - largeio: host8 for large I/O operations (perfect for ISOs and large RPMs)
# - inode64: host4 inodes anywhere on large filesystems (required for 8TB+ volumes)
# - allocsize=128m: host9 space in 128MB chunks (reduces fragmentation for large files)

# Storage Role Limitations:
# - Cannot set PE size (will use default 4 MiB instead of optimal 128 MiB) work around created by using optimize_vg_pe_size
# - No fs_resize parameter (role handles filesystem operations automatically)
