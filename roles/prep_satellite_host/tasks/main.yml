---
# Host preparation tasks for Red Hat Satellite 6.17 installation
# Configures storage, installs packages, and prepares the system

# Always run swap provisioning / migration first
- name: Ensure swap is UUID-based, sized, and active
  import_tasks: swap.yml
  tags: [always, swap]
 
- name: Configure LVM storage for Satellite/Capsule
  redhat.rhel_system_roles.storage:
    volumes:
      - name: "{{ effective_storage_config.vg_name }}"
        type: lvm
        disks:
          - "{{ effective_storage_config.data_disk }}"
        volumes: "{{ effective_storage_config.volumes }}"
  when: effective_storage_config.data_disk is defined
  register: storage_result
  tags: [storage]

- name: Report storage configuration
  debug:
    msg: "Storage configured: {{ effective_storage_config.volumes | length }} volumes created"
  when: storage_result is changed

# System Services
- name: Ensure chrony is installed and started
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true
  register: chrony_status

# SELinux Configuration
- name: Set SELinux to permissive mode
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux_mode }}"
  register: selinux_status

- name: Report SELinux change
  debug:
    msg: "SELinux set to {{ selinux_mode }} mode"
  when: selinux_status is changed

# Firewall Configuration
- name: Disable firewalld for installation
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: not firewall_enabled
  failed_when: false  # Don't fail if firewalld doesn't exist
  register: firewall_status

- name: "Add fcmcontrol user"
  ansible.builtin.include_role:
    name: fcmcontrol-user-creation

- name: "Fix postgres user - create override"
  ansible.builtin.include_role:
    name: postgres-user-override

# Package Installation
- name: Install required packages
  ansible.builtin.dnf:
    name: "{{ satellite_required_packages }}"
    state: present
  register: package_install

- name: Report package installation
  debug:
    msg: "Installed {{ package_install.results | default([]) | length }} packages"
  when: package_install is changed

# System Updates
- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
  register: system_update
  when: true  # Always update for fresh installation

- name: Report update status
  debug:
    msg: "Updated {{ system_update.results | default([]) | length }} packages"
  when: system_update is changed

# Check for required reboot
- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required_file
  when: check_reboot_required | bool

- name: Check for kernel updates requiring reboot
  ansible.builtin.shell: |
    if [ $(rpm -q --last kernel | head -1 | awk '{print $1}' | sed 's/kernel-//') != $(uname -r) ]; then
      echo "reboot required"
    fi
  register: kernel_check
  changed_when: false
  when: check_reboot_required | bool

- name: Set reboot required fact
  ansible.builtin.set_fact:
    needs_reboot: "{{ (reboot_required_file.stat.exists | default(false)) or ('reboot required' in kernel_check.stdout | default('')) }}"
  when: check_reboot_required | bool

# Reboot if required
- name: Reboot system if required
  ansible.builtin.reboot:
    reboot_timeout: "{{ reboot_timeout }}"
    msg: "Rebooting for system updates"
  when:
    - auto_reboot | bool
    - needs_reboot | default(false)

- name: Report reboot requirement
  debug:
    msg: "System requires reboot - please reboot manually"
  when:
    - not auto_reboot | bool
    - needs_reboot | default(false)

# Unregister from existing Satellite
- name: Check current registration status
  ansible.builtin.command: subscription-manager status
  register: sub_status
  changed_when: false
  failed_when: false

- name: Unregister from existing Satellite if registered
  ansible.builtin.command: subscription-manager unregister
  when: "'Current' in sub_status.stdout"
  register: unregister_result

- name: Clean subscription manager
  ansible.builtin.command: subscription-manager clean
  when: unregister_result is changed

- name: Remove any katello-ca-consumer packages
  ansible.builtin.dnf:
    name: "katello-ca-consumer*"
    state: absent
  failed_when: false

# Hostname Configuration
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ satellite_fqdn }}"
  register: hostname_result

- name: Ensure hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ ansible_default_ipv4.address }}.*"
    line: "{{ ansible_default_ipv4.address }} {{ satellite_fqdn }} {{ satellite_fqdn.split('.')[0] }}"
    state: present
  when: ansible_default_ipv4.address is defined

# Final Validation
- name: Validate storage mounts
  ansible.builtin.command: "df -h {{ item.mount }}"
  loop: "{{ satellite_storage_config.volumes }}"
  changed_when: false
  register: mount_check
  failed_when: mount_check.rc != 0

- name: System preparation summary
  debug:
    msg:
      - "Host preparation completed"
      - "Storage: Configured"
      - "SELinux: {{ selinux_mode }}"
      - "Firewall: {{ 'Disabled' if not firewall_enabled else 'Enabled' }}"
      - "Hostname: {{ satellite_fqdn }}"
      - "Packages: Installed and updated"
      - "Registration: Cleaned"