---
# Host preparation tasks for Red Hat Satellite 6.17 installation
# Configures storage, installs packages, and prepares the system
# This role runs on BOTH Satellite and Capsule servers
# Skip expensive tasks on already-installed Satellite
# We add this to tasks:  when: not (is_satellite and satellite_already_installed | default(false))
# HOW THIS CONDITION WORKS:
# 1. Check: Am I the Satellite? (is_satellite)
# 2. Check: Is Satellite already installed? (satellite_already_installed)
# 3. If satellite_already_installed doesn't exist (like on Capsules),
#    default(false) says "assume it's not installed"
# 4. If BOTH are true, skip this task
# 5. Otherwise (Capsules, fresh installs), run it
#
# EXAMPLES:
# - Capsule: is_satellite=false, satellite_already_installed=undefined→false, RUN task
# - Fresh Satellite: is_satellite=true, satellite_already_installed=false, RUN task  
# - Existing Satellite: is_satellite=true, satellite_already_installed=true, SKIP task


# ============================================================================
# PHASE 1: ROLE DETERMINATION AND VALIDATION
# ============================================================================

- name: Determine if host is Satellite or Capsule
  set_fact:
    is_satellite: "{{ inventory_hostname == satellite_fqdn }}"
    is_capsule: "{{ inventory_hostname in capsule_fqdns }}"

- name: Validate host role is defined
  fail:
    msg: |
      ERROR: Host '{{ inventory_hostname }}' is not defined as either Satellite or Capsule!
      This host must be either:
        - The Satellite server: {{ satellite_fqdn }}
        - One of the Capsule servers: {{ capsule_fqdns | join(', ') }}
  when: not is_satellite and not is_capsule

- name: Set host role and configuration
  set_fact:
    host_role: "{{ is_satellite | ternary('satellite', 'capsule') }}"
    effective_storage_config: "{{ is_satellite | ternary(satellite_storage_config, capsule_storage_config) }}"
    rollback_point: "prep_start"  # Initialize rollback tracking

- name: Display host role determination
  debug:
    msg:
      - "================================================================"
      - "Host Role: {{ host_role | upper }}"
      - "FQDN: {{ inventory_hostname }}"
      - "Storage Configuration: {{ host_role }}_storage_config"
      - "================================================================"

# ============================================================================
# PHASE 2: VALIDATE PREREQUISITES
# ============================================================================

- name: Validate RHEL version
  assert:
    that:
      - ansible_distribution == "RedHat"
      - ansible_distribution_major_version == "9"
    fail_msg: "This playbook requires RHEL 9. Current: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"

- name: Set RHEL major version
  set_fact:
    rhel_major_version: "{{ ansible_distribution_major_version | int }}"

- name: Ensure blivet packages are installed # Required for redhat.rhel_system_roles.storage role
  ansible.builtin.package:
    name:
      - python3-blivet
      - python3-pyudev
      - python-unversioned-command
    state: present

# ============================================================================
# PHASE 3: DATA DISK DETECTION (Fixed for proper size comparison)
# ============================================================================

- name: Gather block devices information
  ansible.builtin.command: lsblk -b -dn -o NAME,SIZE,TYPE
  register: disks
  changed_when: false

- name: Get root disk device
  ansible.builtin.set_fact:
    root_disk: >-
      {{
        ansible_mounts
        | selectattr('mount','equalto','/')
        | map(attribute='device')
        | list
        | first
        | regex_replace('^/dev/','')
        | regex_replace('p?[0-9]+$','')
      }}

- name: Parse disk information with proper numeric conversion
  ansible.builtin.set_fact:
    disk_list: >-
      {%- set result = [] -%}
      {%- for line in disks.stdout_lines -%}
        {%- set parts = line.split() -%}
        {%- if parts[2] == 'disk' -%}
          {%- set _ = result.append({'name': parts[0], 'size': parts[1] | int, 'type': parts[2]}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ result }}

# Debug task to verify disk parsing (can be removed in production)
- name: Display parsed disk information
  ansible.builtin.debug:
    msg:
      - "Root disk detected: {{ root_disk }}"
      - "All disks found:"
      - "{{ disk_list }}"
    verbosity: 1

# Since these are fresh servers, we can be more aggressive
# Now properly sorting by numeric size, not string comparison!
- name: Find largest non-root disk for data
  ansible.builtin.set_fact:
    detected_data_disk: >-
      {%- set valid_disks = [] -%}
      {%- for disk in disk_list -%}
        {%- if disk.name != root_disk -%}
          {%- set _ = valid_disks.append(disk) -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if valid_disks | length > 0 -%}
        {{ '/dev/' ~ (valid_disks | sort(attribute='size', reverse=True) | first).name }}
      {%- else -%}
        {{ '/dev/' }}
      {%- endif -%}

# Additional validation - show what we selected and why
- name: Display disk selection logic
  ansible.builtin.debug:
    msg:
      - "Selected data disk: {{ detected_data_disk }}"
      - "Disk sizes in GB:"
      - "{% for disk in disk_list %}  {{ disk.name }}: {{ (disk.size / 1073741824) | round(2) }} GB{% endfor %}"
  when: detected_data_disk != '/dev/'

- name: Validate data disk was found
  ansible.builtin.fail:
    msg: |
      ERROR: No suitable data disk found!
      Root disk: /dev/{{ root_disk }}
      Available disks: {{ disk_list | map(attribute='name') | list }}
      
      Please ensure a second disk is attached for LVM storage.
  when: detected_data_disk is not defined or detected_data_disk == '/dev/'

- name: Update storage configuration with detected disk
  ansible.builtin.set_fact:
    effective_storage_config: "{{ effective_storage_config | combine({'data_disk': detected_data_disk}) }}"

- name: Display storage detection results
  ansible.builtin.debug:
    msg:
      - "Root disk: /dev/{{ root_disk }}"
      - "Data disk: {{ effective_storage_config.data_disk }}"
      - "VG name: {{ effective_storage_config.vg_name }}"
      - "Data disk size: {{ ((disk_list | selectattr('name', 'equalto', detected_data_disk | replace('/dev/', '')) | first).size / 1073741824) | round(2) }} GB"

# ============================================================================
# PHASE 4: CONFIGURE LVM STORAGE WITH ROLLBACK
# ============================================================================

- name: Create rollback checkpoint before storage changes
  set_fact:
    rollback_point: "pre_storage"

# Include PE size optimization
- name: Optimize volume group PE size for large volumes
  include_tasks: optimize_vg_pe_size.yml
  when: effective_storage_config.data_disk is defined

# Configure storage using RHEL system role
- name: Configure LVM storage for {{ host_role }}
  block:
    - name: Apply storage configuration
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.storage
      vars:
        storage_pools:
          - name: "{{ effective_storage_config.vg_name }}"
            type: lvm
            disks: "{{ [] if (vg_already_exists | default(false)) else [effective_storage_config.data_disk] }}"
            state: present
            encryption: false
            volumes: "{{ effective_storage_config.volumes }}"
      when: effective_storage_config.data_disk is defined
      register: storage_result

    - name: Validate critical mount points exist
      stat:
        path: "{{ item }}"
      loop:
        - /var/lib/pulp      # Critical for content storage
        - /var/lib/pgsql     # Critical for database
        - /backup            # Critical for disaster recovery
      register: critical_mounts
      failed_when: not critical_mounts.stat.exists or not critical_mounts.stat.isdir

    - name: Update rollback point after successful storage
      set_fact:
        rollback_point: "storage_complete"

  rescue:
    - name: Storage configuration failed - attempting rollback
      include_tasks: rollback_storage.yml
      vars:
        failed_at: "storage_configuration"

# ============================================================================
# PHASE 5: SYSTEM CONFIGURATION
# ============================================================================

- name: Ensure chrony is installed and started
  ansible.builtin.systemd:
    name: chronyd
    state: started
    enabled: true

- name: Set SELinux to permissive mode
  ansible.posix.selinux:
    policy: targeted
    state: "{{ selinux_mode }}"
  register: selinux_status
  
- name: Disable firewalld for installation
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  when: not firewall_enabled
  failed_when: false

# Critical: Without this certificate, Satellite systems cannot validate Red Hat's SSL
# certificates when connecting to the CDN, causing SSL errors

- name: Ensure /etc/rhsm/ca directory exists
  ansible.builtin.file:
    path: /etc/rhsm/ca
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy Red Hat UEP certificate to all systems
  ansible.builtin.copy:
    src: files/redhat_pem/redhat-uep.pem  # Source file in your repo
    dest: /etc/rhsm/ca/redhat-uep.pem
    owner: root
    group: root
    mode: '0644'
    backup: yes  # Keep backup if file already exists
  register: uep_cert_copy

- name: Verify Red Hat UEP certificate is present
  ansible.builtin.stat:
    path: /etc/rhsm/ca/redhat-uep.pem
  register: uep_cert_stat
  failed_when: not uep_cert_stat.stat.exists

- name: Report UEP certificate deployment
  debug:
    msg:
      - "Red Hat UEP Certificate Status:"
      - "  Deployed to: /etc/rhsm/ca/redhat-uep.pem"
      - "  File exists: {{ uep_cert_stat.stat.exists }}"
      - "  Size: {{ uep_cert_stat.stat.size }} bytes"
      - "  Required for: SSL validation to Red Hat CDN"

# ============================================================================
# PHASE 6: USER MANAGEMENT
# ============================================================================

- name: Add fcmcontrol user for management
  ansible.builtin.include_role:
    name: fcmcontrol-user-creation

- name: Configure postgres user override
  ansible.builtin.include_role:
    name: postgres-user-override

# ============================================================================
# PHASE 7: PACKAGE MANAGEMENT
# ============================================================================

- name: Install required packages
  ansible.builtin.dnf:
    name: "{{ satellite_required_packages }}"
    state: present
  register: package_install
  when: not (is_satellite and satellite_already_installed | default(false))

# Wait for any package locks before updating
- name: Update all packages with lock handling
  block:
    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        lock_timeout: 300  # Wait up to 5 minutes for lock
      register: system_update
      when: not (is_satellite and satellite_already_installed | default(false))
  
  rescue:
    - name: Clear DNF cache and retry
      command: dnf clean all
      changed_when: true
      when: not (is_satellite and satellite_already_installed | default(false))

    - name: Retry package update
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: system_update
      when: not (is_satellite and satellite_already_installed | default(false))

# ============================================================================
# PHASE 8: REBOOT HANDLING (Simplified)
# ============================================================================

- name: Check if reboot is required using needs-restarting
  command: dnf needs-restarting -r
  register: needs_restarting
  changed_when: false
  failed_when: needs_restarting.rc not in [0, 1]
  when: check_reboot_required | bool

- name: Set reboot required fact
  set_fact:
    needs_reboot: "{{ needs_restarting.rc == 1 }}"
  when: check_reboot_required | bool

# Simplified AAP-compatible reboot
- name: Reboot system if required
  when:
    - auto_reboot | bool
    - needs_reboot | default(false)
  block:
    - name: Reboot the system
      ansible.builtin.shell: |
        sleep 2 && shutdown -r now "Ansible reboot for system updates"
      async: 1
      poll: 0
      ignore_errors: true
      changed_when: true

    - name: Wait for system to reboot
      ansible.builtin.wait_for_connection:
        connect_timeout: 20
        sleep: 5
        delay: 40  # Give system time to actually go down
        timeout: "{{ reboot_timeout }}"

    - name: Verify system is back
      ansible.builtin.ping:

# ============================================================================
# PHASE 9: CLEAN EXISTING REGISTRATIONS (SATELLITE ONLY)
# ============================================================================
# Uses subscription-manager identity for reliable registration detection
# Only runs on Satellite server, not Capsules. This is required because force provisioned servers
# come registered to Satellite. Satellite servers must register to CDN. 

- name: Check current registration using identity command
  command: subscription-manager identity
  register: sub_identity
  changed_when: false
  failed_when: false
  when: 
    - inventory_hostname == satellite_fqdn
    - not (is_satellite and satellite_already_installed | default(false))

- name: Determine if system is registered
  set_fact:
    system_is_registered: "{{ 'system identity:' in sub_identity.stdout | lower }}"
  when: 
    - inventory_hostname == satellite_fqdn
    - not (is_satellite and satellite_already_installed | default(false))

- name: Display registration check results
  debug:
    msg:
      - "Registration check for {{ inventory_hostname }}:"
      - "  Registered: {{ system_is_registered | default(false) }}"
  when: 
    - inventory_hostname == satellite_fqdn
    - not (is_satellite and satellite_already_installed | default(false))

- name: Clean any existing registrations (Satellite only)
  when: 
    - inventory_hostname == satellite_fqdn
    - not (is_satellite and satellite_already_installed | default(false))
  block:
    - name: Display registration cleanup target
      debug:
        msg: "Cleaning existing registrations on Satellite server: {{ satellite_fqdn }}"

    - name: Unregister from existing subscription service
      command: subscription-manager unregister
      when: system_is_registered | default(false)
      register: unregister_result
      
    - name: Clean subscription manager
      command: subscription-manager clean
      changed_when: true
      
    - name: Remove katello-ca-consumer packages
      ansible.builtin.dnf:
        name: "katello-ca-consumer*"
        state: absent
      failed_when: false

    - name: Check if rhsm.conf exists
      ansible.builtin.stat:
        path: /etc/rhsm/rhsm.conf
      register: rhsm_conf_stat

    - name: Create timestamped backup of rhsm.conf
      ansible.builtin.copy:
        src: /etc/rhsm/rhsm.conf
        dest: "/etc/rhsm/rhsm.conf.backup.{{ ansible_date_time.epoch }}"
        remote_src: yes
        mode: '0644'
        owner: root
        group: root
      when: rhsm_conf_stat.stat.exists

    # Reset RHSM configuration to Red Hat CDN defaults
    - name: Configure RHSM server hostname to Red Hat CDN
      ansible.builtin.ini_file:
        path: /etc/rhsm/rhsm.conf
        section: server
        option: hostname
        value: subscription.rhsm.redhat.com
        backup: yes
        mode: '0644'
        owner: root
        group: root

    - name: Configure RHSM server prefix
      ansible.builtin.ini_file:
        path: /etc/rhsm/rhsm.conf
        section: server
        option: prefix
        value: /subscription
        mode: '0644'
        owner: root
        group: root

    - name: Configure RHSM baseurl to Red Hat CDN
      ansible.builtin.ini_file:
        path: /etc/rhsm/rhsm.conf
        section: rhsm
        option: baseurl
        value: https://cdn.redhat.com
        mode: '0644'
        owner: root
        group: root

    # CRITICAL FIX: Configure CA certificate for SSL validation
    - name: Configure RHSM repo CA certificate path
      ansible.builtin.ini_file:
        path: /etc/rhsm/rhsm.conf
        section: rhsm
        option: repo_ca_cert
        value: /etc/rhsm/ca/redhat-uep.pem
        mode: '0644'
        owner: root
        group: root

    # Configure proxy settings for CDN access
    - name: Configure proxy hostname for CDN access
      ansible.builtin.ini_file:
        path: /etc/rhsm/rhsm.conf
        section: server
        option: proxy_hostname
        value: "{{ server_proxy_hostname }}"
        mode: '0644'
        owner: root
        group: root

    - name: Configure proxy port for CDN access
      ansible.builtin.ini_file:
        path: /etc/rhsm/rhsm.conf
        section: server
        option: proxy_port
        value: "80"
        mode: '0644'
        owner: root
        group: root

    - name: Remove proxy authentication if present
      ansible.builtin.ini_file:
        path: /etc/rhsm/rhsm.conf
        section: server
        option: "{{ item }}"
        state: absent
      loop:
        - proxy_user
        - proxy_password
      failed_when: false

    # Verify the complete configuration
    - name: Verify RHSM configuration including proxy and CA cert
      ansible.builtin.command: |
        grep -E '^hostname|^prefix|^baseurl|^proxy_hostname|^proxy_port|^repo_ca_cert' /etc/rhsm/rhsm.conf | grep -v '^#'
      register: rhsm_verify
      changed_when: false
      failed_when: false

    - name: Display complete RHSM configuration
      ansible.builtin.debug:
        msg:
          - "RHSM configured for Red Hat CDN:"
          - "{{ rhsm_verify.stdout_lines | default(['Configuration set']) }}"

    - name: Verify system is unregistered
      command: subscription-manager identity
      register: identity_check
      failed_when: false
      changed_when: false

    - name: Confirm unregistration
      assert:
        that:
          - "'system identity:' not in identity_check.stdout | lower"
        fail_msg: "System still appears to be registered after cleanup!"
        success_msg: "System successfully unregistered and ready for CDN registration"

    - name: Registration cleanup summary for Satellite
      debug:
        msg:
          - "Satellite registration cleanup completed:"
          - "  - Previous registration: {{ 'Removed' if system_is_registered | default(false) else 'None found' }}"
          - "  - RHSM configuration: Reset to Red Hat CDN"
          - "  - Proxy configured: {{ server_proxy_hostname }}:80"
          - "  - CA certificate: /etc/rhsm/ca/redhat-uep.pem"
          - "  - repo_ca_cert: Configured in rhsm.conf"
          - "  - SSL validation: Ready"
          - "  - Ready for: CDN registration through proxy with SSL"

- name: Capsule registration note
  when: inventory_hostname != satellite_fqdn
  debug:
    msg:
      - "Host {{ inventory_hostname }} is a Capsule"
      - "Skipping registration cleanup - Capsules will register to Satellite later"
      - "UEP certificate IS deployed in a prior step for future use if needed for whatever reason"

# ============================================================================
# PHASE 10: FINAL VALIDATION
# ============================================================================

- name: Validate storage mounts are accessible
  command: "df -h {{ item.mount_point }}"
  loop: "{{ effective_storage_config.volumes }}"
  changed_when: false
  failed_when: false
  register: mount_check

- name: Verify all mounts succeeded
  assert:
    that: item.rc == 0
    fail_msg: "Mount point {{ item.item.mount_point }} is not accessible"
  loop: "{{ mount_check.results }}"
  loop_control:
    label: "{{ item.item.mount_point }}"

# ============================================================================
# PHASE 11: PREPARATION SUMMARY
# ============================================================================

- name: System preparation summary
  debug:
    msg:
      - "================================================"
      - "Host Preparation Completed Successfully!"
      - "================================================"
      - "Host Role: {{ host_role | upper }}"
      - "Hostname: {{ inventory_hostname }}"
      - "Storage: {{ effective_storage_config.volumes | length }} volumes configured"
      - "Data Disk: {{ effective_storage_config.data_disk }}"
      - "SELinux: {{ selinux_mode }}"
      - "Packages: Installed and updated"
      - "Ready for: {{ is_satellite | ternary('Satellite installation', 'Capsule configuration') }}"
      - "================================================"