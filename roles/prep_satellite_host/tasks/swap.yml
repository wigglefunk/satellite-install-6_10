# ------------------------
# DETECT DATA DISK + STORAGE CONFIG
# ------------------------
- name: Determine host role (Satellite vs Capsule)
  set_fact:
    effective_storage_config: >-
      {{ (inventory_hostname in capsule_fqdns)
          | ternary(capsule_storage_config, satellite_storage_config) }}

- name: Gather block devices
  command: lsblk -b -dn -o NAME,SIZE,TYPE
  register: disks
  changed_when: false

- name: Find largest non-root, non-swap, non-mounted disk
  set_fact:
    detected_data_disk: >-
      {{
        '/dev/' ~ (
          disks.stdout_lines
          | map('split', ' ')
          | selectattr('2','equalto','disk')
          | rejectattr('0','equalto',(ansible_mounts | selectattr("mount","equalto","/") | map(attribute="device") | list | first) | regex_replace("^/dev/","") | regex_replace("p?\\d+$",""))
          | rejectattr('0','equalto','nvme1n1')  # exclude known swap disk
          | sort(attribute='1', reverse=True)
          | first
          | first
        )
      }}

- name: Set data_disk in config fact
  set_fact:
    effective_storage_config: "{{ effective_storage_config | combine({'data_disk': detected_data_disk}) }}"

- name: Debug summary for swap and storage detection
  debug:
    msg:
      - "Host role: {{ 'Capsule' if (inventory_hostname in capsule_fqdns) else 'Satellite' }}"
      - "Data disk selected for LVM: {{ effective_storage_config.data_disk }}"
      - "VG name: {{ effective_storage_config.vg_name }}"
      - "Number of LVs in plan: {{ effective_storage_config.volumes | length }}"
      # - "Swap active: {{ (free_m.stdout_lines | select('search','Swap:') | first).split()[1] }} MiB total"