---
- name: Generate Capsule cert tarballs on Satellite hosts
  when: inventory_hostname == satellite_fqdn  # FIXED: == not in
  block:
    - name: Process each Capsule FQDN for tar generation
      ansible.builtin.include_tasks: generate_single_capsule_tar.yml
      loop: "{{ capsule_fqdns }}"
      loop_control:
        loop_var: capsule_fqdn