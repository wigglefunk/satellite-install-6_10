---
# This role runs on Capsule servers to retrieve their certificate tarballs from the Satellite
# We should have already generated unique certificate tarballs on the Satellite for each Capsule(generate_capsule_tar)
# We use a fetch-then-copy pattern because it's the most reliable cross-platform method

- name: Distribute Capsule cert tarballs to Capsule hosts
  # The 'capsule_fqdns' list in group_vars is our master list of all Capsules
  # This condition checks: "Is this current host in the Capsule list?"
  # Only hosts in that list will run these tasks - all others skip
  when: inventory_hostname in capsule_fqdns
  block:

    - name: Derive capsule shortname and file paths
      set_fact:
        capsule_shortname: "{{ ansible_hostname }}"
        # Each Capsule uses its OWN fqdn to find its specific cert files
        capsule_fqdn: "{{ ansible_fqdn }}"
        # Local temp directory on the Ansible controller (where this playbook runs from)
        local_temp_dir: "/tmp/capsule-certs-{{ ansible_fqdn }}"

    - name: Create local temp directory on Ansible controller
      # This runs on the Ansible controller machine (AAP or local)
      # We need a staging area to temporarily hold files during transfer
      file:
        path: "{{ local_temp_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: no

    # STEP 1: FETCH - Pull files from Satellite to Ansible controller
    # The fetch module is the most reliable way to get files from remote hosts
    # It automatically handles SSH transfers and works across all platforms
    - name: Fetch capsule cert tar from Satellite to Ansible controller
      ansible.builtin.fetch:
        # The Satellite has a cert file named after THIS specific Capsule's FQDN
        src: "/root/capsule_cert/{{ capsule_shortname }}/{{ capsule_fqdn }}-certs.tar"
        dest: "{{ local_temp_dir }}/"
        flat: yes  # Don't create subdirectories, just put the file directly in dest
        fail_on_missing: yes  # Fail immediately if the file doesn't exist
      delegate_to: "{{ satellite_fqdn }}"  # Run this task ON the Satellite server

    - name: Fetch capsule install instructions from Satellite to Ansible controller
      ansible.builtin.fetch:
        src: "/root/capsule_cert/{{ capsule_shortname }}/{{ capsule_fqdn }}-install.txt"
        dest: "{{ local_temp_dir }}/"
        flat: yes
        fail_on_missing: yes
      delegate_to: "{{ satellite_fqdn }}"

    # STEP 2: PREPARE - Create destination directory on Capsule
    - name: Ensure capsule cert directory exists on Capsule
      file:
        path: "/root/capsule_cert"
        state: directory
        owner: root
        group: root
        mode: '0700'
      # No delegation here - this runs on the actual Capsule host

    # STEP 3: COPY - Push files from Ansible controller to Capsule
    # Now we copy from the controller's temp directory to the Capsule
    - name: Copy capsule cert tar from Ansible controller to Capsule
      ansible.builtin.copy:
        # Source uses THIS Capsule's FQDN in the filename
        src: "{{ local_temp_dir }}/{{ capsule_fqdn }}-certs.tar"
        # Each Capsule gets its own specifically-named cert file
        dest: "/root/capsule_cert/{{ capsule_fqdn }}-certs.tar"
        owner: root
        group: root
        mode: '0600'
        # remote_src is NOT used here because we're copying FROM the controller
      register: tar_copy

    - name: Copy install instructions from Ansible controller to Capsule
      ansible.builtin.copy:
        src: "{{ local_temp_dir }}/{{ capsule_fqdn }}-install.txt"
        dest: "/root/capsule_cert/{{ capsule_fqdn }}-install.txt"
        owner: root
        group: root
        mode: '0600'
      register: txt_copy

    # STEP 4: CLEANUP - Remove temp files from Ansible controller
    # Clean up our temp directory to avoid leaving sensitive cert files around
    - name: Clean up temp directory on Ansible controller
      file:
        path: "{{ local_temp_dir }}"
        state: absent
      delegate_to: localhost
      become: no
      when: tar_copy is succeeded and txt_copy is succeeded

    # STEP 5: VALIDATE - Ensure files arrived correctly
    - name: Validate cert tar exists and has content
      stat:
        path: "/root/capsule_cert/{{ capsule_fqdn }}-certs.tar"
      register: tar_stat
      failed_when: not tar_stat.stat.exists or tar_stat.stat.size == 0

    - name: Validate install instructions exist and have content
      stat:
        path: "/root/capsule_cert/{{ capsule_fqdn }}-install.txt"
      register: txt_stat
      failed_when: not txt_stat.stat.exists or txt_stat.stat.size == 0

    # STEP 6: REPORT - Show what was accomplished
    - name: Report successful distribution
      debug:
        msg:
          - "✓ Successfully distributed Capsule certificates"
          - "  Capsule: {{ capsule_fqdn }}"
          - "  Tar file: {{ tar_stat.stat.size }} bytes"
          - "  Instructions: {{ txt_stat.stat.size }} bytes"
          - "  Source: {{ satellite_fqdn }}"
          - "  Destination: /root/capsule_cert/"

# How the Capsule identification works:
# 1. capsule_fqdns (in group_vars) = Master list of all Capsules
# 2. inventory_hostname = The current host Ansible is processing
# 3. 'when: inventory_hostname in capsule_fqdns' = Is this host a Capsule?
# 4. If yes, use ansible_fqdn (this host's actual FQDN) to fetch its specific files
#
# Example: If capsule1.example.com is processing this role:
# - It checks: "Am I in the capsule_fqdns list?" → YES
# - It fetches: capsule1.example.com-certs.tar (its OWN cert)
# - It stores: /root/capsule_cert/capsule1.example.com-certs.tar
#
# Why this approach?
# 1. FETCH + COPY is the most reliable pattern that works everywhere (AWS, VMware, etc.)
# 2. It's explicit and easy to debug - you can see each step clearly
# 3. It handles SSH keys/authentication properly through Ansible's native mechanisms
# 4. It includes validation to ensure files actually transferred
# 5. It cleans up after itself to avoid leaving sensitive files on the controller
# Alternative approaches and why we don't use them:
# - synchronize module: Requires rsync, not always available in restricted environments
# - remote_src with delegate_to: Doesn't actually copy between hosts, common misconception
# - scp/ssh commands: Would bypass Ansible's authentication and error handling