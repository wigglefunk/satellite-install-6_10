---
- name: Run Capsule cert prep on Satellite hosts only
  when: inventory_hostname == satellite_fqdn  # Fixed: == not in
  block:
    - name: Process each Capsule FQDN
      ansible.builtin.include_tasks: process_capsule_cert.yml
      loop: "{{ capsule_fqdns }}"
      loop_control:
        loop_var: capsule_fqdn