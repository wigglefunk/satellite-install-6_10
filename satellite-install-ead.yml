---
# ===============================================================================
# satellite-install.yml with Hybrid Check to screen out broken satellite installs
# ===============================================================================

- name: Install Red Hat Satellite 6.17
  hosts: all  # AAP will limit to appropriate hosts via inventory
  become: true
  gather_facts: true
  vars_files:
    - group_vars/ead_env.yml  # Explicitly load variables for AAP
  
  # Module defaults for Satellite API operations
  module_defaults:
    group/redhat.satellite.satellite:
      server_url: "{{ satellite_server_url }}"
      username: "{{ satellite_setup_username }}"
      password: "{{ satellite_initial_admin_password }}"
      validate_certs: false
      
  pre_tasks:
    - name: Determine RHEL version of current host
      set_fact:
        rhel_major_version: "{{ ansible_distribution_major_version | int }}"

    - name: Display host RHEL version
      debug:
        msg: "Host {{ inventory_hostname }} is running RHEL {{ rhel_major_version }}"
    
    # Validate target system
    - name: Validate minimum requirements
      assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version == "9"
          - ansible_memtotal_mb >= 20480  # 20GB minimum
        fail_msg: "System does not meet minimum requirements for Satellite 6.17"
        success_msg: "System meets minimum requirements"
    
    # DNS validation with retries
    - name: Validate DNS resolution
      command: "nslookup {{ satellite_fqdn }}"
      register: dns_check
      until: dns_check.rc == 0
      retries: 3
      delay: 10
      failed_when: false
      changed_when: false
      when: validate_dns | bool
    
    - name: Fail if DNS validation failed after retries
      fail:
        msg: "DNS resolution failed for {{ satellite_fqdn }} after 3 attempts. Please fix DNS or set validate_dns to false"
      when:
        - validate_dns | bool
        - dns_check.rc != 0
    
    # ========================================================================
    # Pre-check Satellite installation status
    # ========================================================================
    - name: Check Satellite installation status
      when: inventory_hostname == satellite_fqdn
      block:
        - name: Check for Satellite configuration file
          ansible.builtin.stat:
            path: /etc/foreman-installer/scenarios.d/satellite-answers.yaml
          register: satellite_config_check
        
        - name: Check Foreman service status
          ansible.builtin.systemd:
            name: foreman
          register: foreman_check
          failed_when: false
          changed_when: false
        
        - name: Determine if Satellite is already installed
          set_fact:
            satellite_already_installed: >-
              {{
                satellite_config_check.stat.exists and
                (foreman_check.status.ActiveState | default('inactive')) == 'active'
              }}
            
        - name: Report Satellite installation status
          debug:
            msg: >-
              Satellite is {{ 'ALREADY INSTALLED' if satellite_already_installed else 'NOT INSTALLED' }} on {{ inventory_hostname }}.
              {{ 'Role will be skipped.' if satellite_already_installed else 'Proceeding with installation.' }}
    
    # Set default for non-Satellite hosts
    - name: Set default for non-Satellite hosts
      when: inventory_hostname != satellite_fqdn
      set_fact:
        satellite_already_installed: false
        
    - name: Display installation plan
      debug:
        msg:
          - "Starting Satellite 6.17 deployment workflow"
          - "Target: {{ satellite_fqdn }}"
          - "Organization: {{ satellite_org }}"
          - "Location: {{ satellite_location }}"
          - "Satellite installation needed: {{ not satellite_already_installed }}"
  
  roles:
    # Phase 1: Prepare the hosts (ALWAYS RUNS)
    - role: fcmcontrol-user-creation
    - role: postgres-user-override
    - role: prep_satellite_host
      tags:
        - prep
        - storage
        - packages
    
    # Phase 2: Install Satellite (ONLY IF NOT INSTALLED)
    - role: install_satellite
      when: 
        - inventory_hostname == satellite_fqdn
        - not satellite_already_installed | default(false)
      tags:
        - install
        - satellite
    
    # Phase 3: Prepare Capsule certs from zips on Satellite (ALWAYS RUNS)
    - role: prepare_capsule_certs
      when: inventory_hostname == satellite_fqdn
      tags:
        - certs
        - capsule

    # Phase 4: Generate capsule certificates on Satellite (CHECKS INTERNALLY)
    - role: generate_capsule_tar
      when: inventory_hostname == satellite_fqdn
      tags:
        - capsule
        - certs
        - generate

    # Phase 5: Distribute Capsule cert tarballs (CHECKS INTERNALLY)
    - role: distribute_capsule_tar
      when: inventory_hostname in capsule_fqdns
      tags:
        - capsule
        - certs
        - distribute

  post_tasks:
    # Only show installation complete message on Satellite
    - name: Installation complete message
      when: inventory_hostname == satellite_fqdn
      debug:
        msg:
          - "Satellite 6.17 workflow completed!"
          - "Satellite was: {{ 'already installed (skipped)' if satellite_already_installed else 'newly installed' }}"
          - "Access URL: {{ satellite_server_url }}"
          - "Username: admin"
          - "Next step: {{ 'Configure content' if not satellite_already_installed else 'System ready' }}"
    
    # Only show certificate results on Satellite
    - name: Display certificate generation results
      when: 
        - inventory_hostname == satellite_fqdn
        - capsule_fqdns | length > 0
      debug:
        msg: "Capsule certificates processed for: {{ capsule_fqdns | join(', ') }}"
    
    # Only set stats on Satellite
    - name: Create installation summary
      when: inventory_hostname == satellite_fqdn
      set_stats:
        data:
          satellite_url: "{{ satellite_server_url }}"
          satellite_version: "6.17"
          organization: "{{ satellite_org }}"
          location: "{{ satellite_location }}"
          installation_date: "{{ ansible_date_time.iso8601 }}"
          capsule_count: "{{ capsule_fqdns | length }}"
          satellite_was_already_installed: "{{ satellite_already_installed | string }}"
    
    # Message for Capsules
    - name: Capsule preparation complete message
      when: inventory_hostname in capsule_fqdns
      debug:
        msg:
          - "Capsule preparation completed for: {{ inventory_hostname }}"
          - "Next step: Run capsule-installer using instructions in /root/capsule_cert/"